<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' asset:;">
    <title>Ravana, Your AI Assistant Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app-container" class="app-container layout-top">
        <!-- The header becomes the sidebar in side-layout mode -->
        <header class="app-header">
            <nav id="tab-nav" class="tab-nav">
                <!-- Tabs will be dynamically inserted here -->
            </nav>
            <div class="app-controls">
                <div class="controls-group">
                    <button id="layout-switch-btn" class="btn btn-icon-only" title="Switch Layout"></button>
                    <button id="theme-toggle-btn" class="btn btn-icon-only" title="Toggle Theme">
                        <!-- Icon injected by JS -->
                    </button>
                    <button id="settings-btn" class="btn btn-icon-only" title="Settings">
                        <!-- Icon injected by JS -->
                    </button>
                </div>
            </div>
        </header>

        <!-- This handle is only visible in side-layout mode -->
        <div id="resize-handle"></div>

        <main id="webview-container" class="webview-container">
            <!-- Webviews will be dynamically inserted here -->
        </main>
    </div>

    <script src="js/sortable.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
